<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="windowBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset="1" stop-color="#0A101B"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35E6C4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#35E6C4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coverA" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#081526"/>
      <stop offset=".52" stop-color="#245881"/>
      <stop offset="1" stop-color="#8B5CFF"/>
    </linearGradient>
    <linearGradient id="coverB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#07141A"/>
      <stop offset=".55" stop-color="#176B65"/>
      <stop offset="1" stop-color="#35E6C4"/>
    </linearGradient>
    <linearGradient id="coverLocal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#161128"/>
      <stop offset=".55" stop-color="#432A61"/>
      <stop offset="1" stop-color="#FF5F70"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#35E6C4" stroke-opacity=".035"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity=".36"/>
    </filter>
    <clipPath id="localClip"><rect x="364" y="330" width="390" height="190" rx="12"/></clipPath>
    <clipPath id="aClip"><rect x="836" y="284" width="256" height="192" rx="10"/></clipPath>
    <clipPath id="bClip"><rect x="836" y="554" width="256" height="192" rx="10"/></clipPath>
    <style>
      .cn { font-family: "Microsoft YaHei UI","Microsoft YaHei",sans-serif; }
      .tech { font-family: "Bahnschrift","Segoe UI",sans-serif; letter-spacing: 1.2px; }
      .primary { fill:#F4F7FB; }
      .secondary { fill:#9AABC1; }
      .muted { fill:#66778F; }
      .panel { fill:#0D1420; stroke:#243248; stroke-width:1; }
      .raised { fill:#111D2B; stroke:#2B3C53; stroke-width:1; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#03050A"/>
  <rect x="30" y="24" width="1540" height="952" rx="16" fill="url(#windowBg)" stroke="#29374B" filter="url(#shadow)"/>
  <rect x="30" y="24" width="1540" height="952" rx="16" fill="url(#grid)"/>

  <!-- custom title bar -->
  <path d="M46 24H1554A16 16 0 0 1 1570 40V94H30V40A16 16 0 0 1 46 24Z" fill="#090E18"/>
