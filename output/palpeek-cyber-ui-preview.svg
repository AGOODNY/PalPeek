        <text x="63" y="21" text-anchor="middle" class="tech secondary" font-size="10">720P 60FPS</text>
        <rect x="136" width="118" height="32" rx="7" fill="#111D2B" stroke="#2B3C53"/>
        <text x="195" y="21" text-anchor="middle" class="cn secondary" font-size="11">0 / 3 人观看</text>
