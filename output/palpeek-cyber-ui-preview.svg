  <g transform="translate(58 45)">
    <path d="M0 15 15 0h22l15 15-15 15H15Z" fill="none" stroke="#35E6C4" stroke-width="2.5"/>
    <path d="m16 8 12 7-12 7Z" fill="#35E6C4"/>
    <text x="67" y="23" class="tech primary" font-size="22" font-weight="700">PALPEEK</text>
    <text x="196" y="22" class="tech muted" font-size="11">SPECTATOR NETWORK</text>
  </g>
  <g transform="translate(1130 54)">
